
name: Build Monolith APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'
        log-accepted-android-sdk-licenses: false

    - name: Install NDK and CMake
      run: |
        sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"
        echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/27.3.13750724" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.3.13750724" >> $GITHUB_ENV

    - name: Setup Gradle 8.0.2
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 8.0.2

    - name: Decode Fixed Keystore
      run: |
        set -euo pipefail
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/fixed.p12"
        test -s "$RUNNER_TEMP/fixed.p12"

    - name: Clean and Build with Gradle (Signed)
      env:
        KEYSTORE_FILE: ${{ runner.temp }}/fixed.p12
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        gradle clean assembleDebug

    - name: Validate APK Before Release
      shell: bash
      run: |
        set -euo pipefail

        APK="app/build/outputs/apk/debug/app-debug.apk"

        echo "Checking APK file..."
        test -s "$APK"

        echo "Locating Android Build Tools..."
        BUILD_TOOLS_VERSION="$(find "$ANDROID_SDK_ROOT/build-tools" \
          -mindepth 1 -maxdepth 1 -type d \
          -printf '%f\n' | sort -V | tail -n 1)"

        if [ -z "$BUILD_TOOLS_VERSION" ]; then
          echo "::error::Android Build Tools were not found."
          exit 1
        fi

        BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"

        ZIPALIGN="$BUILD_TOOLS/zipalign"
        APKSIGNER="$BUILD_TOOLS/apksigner"
        AAPT="$BUILD_TOOLS/aapt"

        test -x "$ZIPALIGN"
        test -x "$APKSIGNER"
        test -x "$AAPT"

        echo "Checking APK alignment..."
        "$ZIPALIGN" -c -v 4 "$APK"

        echo "Verifying APK signature..."
        "$APKSIGNER" verify --verbose --print-certs "$APK"

        echo "Checking APK package and Android versions..."
        "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"

        if ! grep -Eq "^package: name='com\.monolith'([[:space:]]|$)" \
          "$RUNNER_TEMP/apk-badging.txt"; then
          echo "::error::Invalid application ID."
          cat "$RUNNER_TEMP/apk-badging.txt"
          exit 1
        fi

        if ! grep -Eq "^sdkVersion:'26'$" "$RUNNER_TEMP/apk-badging.txt"; then
          echo "::error::Unexpected minimum Android SDK."
          cat "$RUNNER_TEMP/apk-badging.txt"
          exit 1
        fi

        if ! grep -Eq "^native-code:.*'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"; then
          echo "::error::APK does not contain the required arm64-v8a ABI."
          cat "$RUNNER_TEMP/apk-badging.txt"
          exit 1
        fi

        echo "Checking native libraries..."
        unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-files.txt"

        for LIB in \
          "lib/arm64-v8a/libmonolith.so" \
          "lib/arm64-v8a/libc++_shared.so"; do
          if ! grep -Fxq "$LIB" "$RUNNER_TEMP/apk-files.txt"; then
            echo "::error::Missing native library: $LIB"
            exit 1
          fi
        done

        echo "APK validation passed."
        sha256sum "$APK"

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: v1.0.${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

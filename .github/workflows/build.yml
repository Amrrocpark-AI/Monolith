
name: Build Monolith APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monolith-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Validate Monolith
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          problem-matcher: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.0.2'
          cache-cleanup: on-success

      - name: Decode Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/fixed.p12"

          test -s "$RUNNER_TEMP/fixed.p12"

      - name: Clean and Build Signed APK
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/fixed.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Signing credentials are incomplete."
            exit 1
          fi

          gradle --no-daemon clean assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."
          test -s "$APK"

          echo "Locating Android Build Tools..."

          BUILD_TOOLS_VERSION="$(
            find "$ANDROID_SDK_ROOT/build-tools" \
              -mindepth 1 -maxdepth 1 -type d \
              -printf '%f\n' | sort -V | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "::error::Android Build Tools were not found."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          echo "Checking APK alignment..."
          "$ZIPALIGN" -c -v 4 "$APK"

          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "Reading APK metadata..."
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"

          if ! grep -Eq "^package: name='com\.monolith'([[:space:]]|$)" \
            "$RUNNER_TEMP/apk-badging.txt"; then
            echo "::error::Invalid application ID."
            cat "$RUNNER_TEMP/apk-badging.txt"
            exit 1
          fi

          if ! grep -Eq "^sdkVersion:'26'$" \
            "$RUNNER_TEMP/apk-badging.txt"; then
            echo "::error::Unexpected minimum Android SDK."
            cat "$RUNNER_TEMP/apk-badging.txt"
            exit 1
          fi

          if ! grep -Eq "^native-code:.*'arm64-v8a'" \
            "$RUNNER_TEMP/apk-badging.txt"; then
            echo "::error::Required arm64-v8a ABI is missing."
            cat "$RUNNER_TEMP/apk-badging.txt"
            exit 1
          fi

          echo "Checking native libraries..."

          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-files.txt"

          for LIB in \
            "lib/arm64-v8a/libmonolith.so" \
            "lib/arm64-v8a/libc++_shared.so"; do

            if ! grep -Fxq "$LIB" "$RUNNER_TEMP/apk-files.txt"; then
              echo "::error::Missing native library: $LIB"
              exit 1
            fi
          done

          echo "APK validation passed."
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Signing Keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/fixed.p12"

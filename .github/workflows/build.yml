name: Build Monolith APK
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'
        log-accepted-android-sdk-licenses: false

    - name: Install NDK and CMake
      run: |
        sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"
        echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/27.3.13750724" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.3.13750724" >> $GITHUB_ENV

    - name: Setup Gradle 8.0.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.0.2

    # الخطوة الجديدة: فك تشفير ملف التوقيع من GitHub Secrets
    - name: Decode Fixed Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/fixed.keystore

    - name: Clean and Build with Gradle (Signed)
      run: |
        gradle clean assembleDebug \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/fixed.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: v1.0.${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
